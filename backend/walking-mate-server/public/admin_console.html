<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신고 관리 콘솔</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">신고 관리 콘솔</h1>
        <button
          onclick="fetchReports()"
          class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition disabled:bg-gray-400"
          id="refresh-button"
          disabled
        >
          새로고침
        </button>
      </div>

      <div id="auth-section" class="mb-6 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4 text-center">관리자 로그인</h2>
        <div class="space-y-4">
          <input
            type="email"
            id="admin-email"
            placeholder="관리자 이메일 (admin)"
            class="w-full p-2 border rounded-md"
            value="admin"
          />
          <input
            type="password"
            id="admin-password"
            placeholder="비밀번호"
            class="w-full p-2 border rounded-md"
          />
          <button
            onclick="adminLogin()"
            id="login-button"
            class="w-full px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition"
          >
            로그인
          </button>
        </div>
        <p id="login-error" class="text-red-500 text-sm mt-2 text-center"></p>
      </div>

      <div id="report-section" class="hidden">
        <div id="report-list" class="space-y-4"></div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "/api/admin";
      let accessToken = null;

      async function adminLogin() {
        const email = document.getElementById("admin-email").value;
        const password = document.getElementById("admin-password").value;
        const loginError = document.getElementById("login-error");
        const loginButton = document.getElementById("login-button");

        loginError.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "로그인 중...";

        try {
          const response = await fetch(`${API_BASE_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "로그인에 실패했습니다.");
          }

          accessToken = data.accessToken;
          document.getElementById("auth-section").classList.add("hidden");
          document.getElementById("report-section").classList.remove("hidden");
          document.getElementById("refresh-button").disabled = false;
          await fetchReports();
        } catch (error) {
          loginError.textContent = error.message;
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "로그인";
        }
      }

      async function fetchReports() {
        if (!accessToken) {
          alert("먼저 로그인해주세요.");
          return;
        }

        const reportList = document.getElementById("report-list");
        reportList.innerHTML =
          '<p class="text-center text-gray-500">신고 목록을 불러오는 중...</p>';

        try {
          const response = await fetch(`${API_BASE_URL}/reports`, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });

          if (response.status === 401) {
            throw new Error(
              "인증 토큰이 만료되었거나 유효하지 않습니다. 다시 로그인해주세요."
            );
          }
          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || "서버 오류가 발생했습니다.");
          }

          const reports = await response.json();
          renderReports(reports);
        } catch (error) {
          reportList.innerHTML = `<p class="text-center text-red-500">오류: ${error.message}</p>`;
          if (error.message.includes("인증")) {
            document.getElementById("auth-section").classList.remove("hidden");
            document.getElementById("report-section").classList.add("hidden");
            document.getElementById("refresh-button").disabled = true;
            accessToken = null;
          }
        }
      }

      function renderReports(reports) {
        const reportList = document.getElementById("report-list");
        if (reports.length === 0) {
          reportList.innerHTML =
            '<p class="text-center text-gray-500">처리할 신고가 없습니다.</p>';
          return;
        }

        reportList.innerHTML = reports
          .map(
            (report) => `
                <div class="bg-white rounded-lg shadow-md p-4" id="report-${
                  report.report_id
                }">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <div class="flex items-center text-sm text-gray-500 mb-2">
                                <span>ID: ${report.report_id}</span>
                                <span class="mx-2">|</span>
                                <span>${new Date(
                                  report.created_at
                                ).toLocaleString("ko-KR")}</span>
                            </div>
                            <p class="font-semibold text-gray-800">신고 사유: <span class="font-normal">${
                              report.reason
                            }</span></p>
                            <div class="mt-2 text-sm">
                                <p><span class="font-semibold">신고자:</span> ${
                                  report.reporter_nickname
                                }</p>
                                <p><span class="font-semibold">피신고자:</span> ${
                                  report.reported_nickname
                                } (ID: ${report.reported_user_id})</p>
                                <p><span class="font-semibold">대상:</span> ${
                                  report.target_type
                                } (ID: ${report.target_id})</p>
                            </div>
                        </div>
                        <div>
                            ${
                              report.screenshot_url
                                ? `<a href="/${report.screenshot_url}" target="_blank" class="block w-full h-32 bg-gray-200 rounded-md flex items-center justify-center text-blue-500 hover:underline mb-4"><img src="/${report.screenshot_url}" class="max-w-full max-h-full object-contain"></a>`
                                : '<div class="w-full h-32 bg-gray-200 rounded-md flex items-center justify-center text-gray-500 mb-4">스크린샷 없음</div>'
                            }
                            <div class="flex flex-col space-y-2">
                                <button onclick="processReport(${
                                  report.report_id
                                }, 'dismiss', ${
              report.reported_user_id
            })" class="w-full px-3 py-2 text-sm bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">무시</button>
                                <button onclick="processReport(${
                                  report.report_id
                                }, 'ban', ${
              report.reported_user_id
            })" class="w-full px-3 py-2 text-sm bg-yellow-500 text-white rounded-md hover:bg-yellow-600">1일 정지</button>
                                <button onclick="processReport(${
                                  report.report_id
                                }, 'deactivate', ${
              report.reported_user_id
            })" class="w-full px-3 py-2 text-sm bg-red-500 text-white rounded-md hover:bg-red-600">회원 탈퇴</button>
                            </div>
                        </div>
                    </div>
                </div>
            `
          )
          .join("");
      }

      async function processReport(reportId, action, reportedUserId) {
        if (!accessToken) {
          alert("인증 토큰이 없습니다. 다시 로그인해주세요.");
          return;
        }
        if (!confirm(`정말로 이 신고를 '${action}' 처리하시겠습니까?`)) return;

        try {
          const response = await fetch(
            `${API_BASE_URL}/reports/${reportId}/process`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ action, reportedUserId }),
            }
          );

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || "처리 중 오류가 발생했습니다.");
          }

          alert("신고가 처리되었습니다.");
          document.getElementById(`report-${reportId}`).remove();
        } catch (error) {
          alert(`오류: ${error.message}`);
        }
      }
    </script>
  </body>
</html>
